# Windows NSIS installer (D16). M0 packages the desktop shell only; M10.T4 adds extraResources for
# the embedded Python venv, portable PostgreSQL, FFmpeg and config (installer/build-*.ps1).
appId: dev.projecttitan.desktop
productName: Titan
copyright: Copyright 2026 Project Titan contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
publish: null
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Titan-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Titan
  deleteAppDataOnUninstall: false
linux:
  target: [dir]
# Section 9.6: RunAsNode and Node CLI inspect flags off. The renderer is served from app://titan,
# so file:// needs no extra privileges.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
