<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="%TITAN_CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titan</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        min-height: 760px;
      }
      body {
        background: #0b0e14;
        color: #e6edf7;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .titan-shell {
        box-sizing: border-box;
        min-height: 760px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 8px;
      }
      .titan-session {
        background: #121722;
        border: 1px solid #2a3344;
        border-radius: 8px;
        padding: 10px 12px;
      }
      .titan-program {
        flex: 1;
        margin-top: 8px;
        min-height: 240px;
        border: 1px solid #8ea0b8;
        border-radius: 10px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .titan-program-label {
        letter-spacing: 0.12em;
        font-size: 12px;
        color: #93a1b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="titan-shell" aria-label="Opening the Operations Center">
        <header class="titan-session">Titan · Opening the Operations Center</header>
        <section class="titan-program">
          <div>
            <p class="titan-program-label">PROGRAM</p>
            <p>Opening the Operations Center</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
