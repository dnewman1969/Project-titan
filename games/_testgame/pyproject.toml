[project]
name = "titan-game-testgame"
version = "0.1.0"
description = "Dummy game package for plugin discovery tests"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-sdk-games", "titan-core"]

[project.entry-points."titan.games"]
testgame = "titan_game_testgame.adapter:TestgameAdapter"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_game_testgame"]

[tool.uv.sources]
titan-sdk-games = { workspace = true }
titan-core = { workspace = true }
