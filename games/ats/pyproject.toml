[project]
name = "titan-game-ats"
version = "0.1.0"
description = "American Truck Simulator adapter for Project Titan"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-game-scs-common", "titan-sdk-games", "titan-core"]

[project.entry-points."titan.games"]
ats = "titan_game_ats.adapter:AtsAdapter"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_game_ats"]

[tool.uv.sources]
titan-game-scs-common = { workspace = true }
titan-sdk-games = { workspace = true }
titan-core = { workspace = true }
