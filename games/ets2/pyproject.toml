[project]
name = "titan-game-ets2"
version = "0.1.0"
description = "Euro Truck Simulator 2 adapter for Project Titan"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-game-scs-common", "titan-sdk-games", "titan-core"]

[project.entry-points."titan.games"]
ets2 = "titan_game_ets2.adapter:Ets2Adapter"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_game_ets2"]

[tool.hatch.build.targets.wheel.force-include]
"titan-game.yaml" = "titan-game.yaml"
"controls_default.yaml" = "controls_default.yaml"

[tool.uv.sources]
titan-game-scs-common = { workspace = true }
titan-sdk-games = { workspace = true }
titan-core = { workspace = true }
