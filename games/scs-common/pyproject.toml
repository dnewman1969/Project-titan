[project]
name = "titan-game-scs-common"
version = "0.1.0"
description = "Shared SCS GameAdapter for ETS2 and ATS"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-sdk-games", "titan-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_game_scs"]

[tool.hatch.build.targets.wheel.force-include]
"events.yaml" = "events.yaml"
"titan_game_scs/layouts" = "titan_game_scs/layouts"

[tool.uv.sources]
titan-sdk-games = { workspace = true }
titan-core = { workspace = true }
