# Alembic CLI configuration for development. The URL comes from the layered Titan config
# (TITAN__POSTGRES__* environment variables, Section 9.5) unless -x/sqlalchemy.url is set.
# Prefer `uv run titan-db upgrade` which uses the same config.
[alembic]
script_location = titan_db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
