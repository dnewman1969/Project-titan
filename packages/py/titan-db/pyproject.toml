[project]
name = "titan-db"
version = "0.1.0"
description = "Project Titan PostgreSQL access: Alembic migrations (Section 4.2), SQLAlchemy models and repositories"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "titan-core",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
titan-db = "titan_db.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_db"]

[tool.uv.sources]
titan-core = { workspace = true }
