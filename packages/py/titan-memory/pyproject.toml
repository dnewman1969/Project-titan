[project]
name = "titan-memory"
version = "0.1.0"
description = "Project Titan vectorstore interface, chroma implementation, embedder and retrieval scoring"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_memory"]

[tool.uv.sources]
titan-core = { workspace = true }
