[project]
name = "titan-testing"
version = "0.1.0"
description = "Project Titan shared test fixtures"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-core", "asyncpg>=0.30", "pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_testing"]

[tool.uv.sources]
titan-core = { workspace = true }
