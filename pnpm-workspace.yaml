packages:
  - apps/*
  - packages/ts/*

# pnpm 10 skips dependency install scripts unless allowed. esbuild installs its platform binary in
# postinstall. Electron is downloaded via install.js (Start-Titan / install-electron), not postinstall.
onlyBuiltDependencies:
  - esbuild
  - electron
ignoredBuiltDependencies:
  - electron-winstaller
