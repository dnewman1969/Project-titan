[project]
name = "titan-actions"
version = "0.1.0"
description = "Project Titan input gateway"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-core"]

[project.scripts]
titan-actions = "titan_actions.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_actions"]

[tool.uv.sources]
titan-core = { workspace = true }
