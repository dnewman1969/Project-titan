[project]
name = "titan-capture"
version = "0.1.0"
description = "Project Titan recording"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["titan-core", "websockets>=14.0,<16"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_capture"]

[tool.uv.sources]
titan-core = { workspace = true }
