[project]
name = "titan-telemetry"
version = "0.1.0"
description = "Project Titan telemetry adapter host"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "titan-core",
  "titan-sdk-games",
  "zstandard>=0.23",
  "pyyaml>=6.0",
]

[project.scripts]
titan-telemetry = "titan_telemetry.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan_telemetry"]

[tool.uv.sources]
titan-core = { workspace = true }
titan-sdk-games = { workspace = true }
