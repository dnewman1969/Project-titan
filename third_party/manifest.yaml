# Pinned third-party binaries (M0.T6). These are never committed: tools/fetch-third-party.py
# downloads them into third_party/cache/ and refuses any file whose SHA-256 or size differs.
# To bump a version: update url, version, sha256 and size together in one PR and note it in the
# PR description. Hashes below were computed from the downloaded artifacts on 2026-11-08.
#
# `redistribute` says whether the installer may ship the artifact (risk R9). Artifacts with
# `install: user_consent` are copied into a user's game folder only after explicit consent
# (Section 2.10 install_integration), never bundled.
schema_version: 1
artifacts:
